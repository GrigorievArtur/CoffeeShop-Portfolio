<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Days Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Inter:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #FEF3E2;
            --amber: #F4AE52;
            --burnt: #D4621A;
            --espresso: #2A1A0E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--espresso);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            min-height: 150vh; 
        }

        /* 3D Canvas Background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; 
            pointer-events: none;
        }

        /* ============ PARALLAX WAVE SYSTEM ============ */
        .wave-wrapper {
            position: fixed; 
            bottom: 0;
            left: -10%; /* Extended left */
            width: 120%; /* Extended right to prevent cutouts */
            height: 50vh; 
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            
            /* Adjusted mask for the wider wrapper */
            mask-image: linear-gradient(to right, transparent 8%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 50%, black 70%);
            -webkit-mask-image: linear-gradient(to right, transparent 8%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 50%, black 70%);
            
            transform-origin: bottom right;
            transform: rotate(-8deg) scaleY(1.1);
        }

        .wave-track {
            display: flex;
            width: 200%; 
            height: 100%;
            animation: scrollWave 25s linear infinite;
        }

        @keyframes scrollWave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .wave-svg {
            width: 50%; 
            height: 100%;
            flex-shrink: 0;
        }

        .wave-svg svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wave-layer-back {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
        }
        
        .wave-layer-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* ============ LAYOUT ============ */
        .content {
            position: relative;
            z-index: 2;
            padding: 10vw;
            font-family: 'Cormorant', serif;
            font-size: 6.45em;
            padding-bottom: 50vh; 
        }

        .heading-row {
            display: flex;
            align-items: baseline;
            gap: 0.25em;
        }

        .inline-stacked {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 0.75;
            transform: translateY(-0.7em);
        }

        .inline-stacked-item {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 0.75;
            vertical-align: top;
        }

        .small {
            display: inline-block;
            color: var(--amber);
            transform: translate(-0.5em, 0.5em);
            font-size: 0.35em;
            margin-right: -0.5em;
            font-family: 'Cormorant', serif;
        }

        .large {
            color: var(--cream);
            font-family: 'Cormorant', serif;
        }

        /* Grid & Buttons */
        .text-btn-grid {
            display: grid;
            grid-template-columns: auto auto; 
            column-gap: 0.25em; 
            row-gap: 1rem; 
            align-items: baseline;
            justify-items: start;
        }

        .btn-group {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            margin-top: 1.5rem;
            width: 100%;
        }

        .btn {
            width: 70%;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background-color: var(--burnt);
            color: var(--cream);
            padding: 1rem 0;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--amber);
            color: var(--espresso);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- THREE.JS CANVAS -->
    <div id="canvas-container"></div>

    <!-- PARALLAX & LOOPING WAVES -->
    <div class="wave-wrapper">
        
        <!-- BACK WAVE (Burnt Orange) -->
        <div class="wave-layer-back" id="wave-back">
            <div class="wave-track" style="animation-duration: 30s;">
                <div class="wave-svg">
                    <!-- 0-level raised from 340 to 260 -->
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 140, 360 140 C 540 140, 540 260, 720 260 C 900 260, 900 140, 1080 140 C 1260 140, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#D4621A" />
                    </svg>
                </div>
                <div class="wave-svg">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 140, 360 140 C 540 140, 540 260, 720 260 C 900 260, 900 140, 1080 140 C 1260 140, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#D4621A" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- FRONT WAVE (Amber) -->
        <div class="wave-layer-front" id="wave-front">
            <div class="wave-track" style="animation-duration: 18s;">
                <div class="wave-svg">
                    <!-- 0-level raised from 340 to 260 -->
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 170, 360 170 C 540 170, 540 260, 720 260 C 900 260, 900 170, 1080 170 C 1260 170, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#F4AE52" opacity="0.95" />
                    </svg>
                </div>
                <div class="wave-svg">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 170, 360 170 C 540 170, 540 260, 720 260 C 900 260, 900 170, 1080 170 C 1260 170, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#F4AE52" opacity="0.95" />
                    </svg>
                </div>
            </div>
        </div>

    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="heading-row">
            <span>Good</span>
            <span>days</span>
        </div>

        <div class="heading-row">
            <div class="text-btn-grid">
                <span>start</span>
                <span>with a</span>
                
                <div class="btn-group">
                    <button class="btn">Order</button>
                    <button class="btn">Book</button>
                </div>
            </div>

            <div class="inline-stacked">
                <div class="inline-stacked-item">
                    <span class="small">nice</span>
                    <span class="large">coffee</span>
                </div><br>
                <div class="inline-stacked-item">
                    <span class="small">good</span>
                    <span class="large">coffee</span>
                </div><br>
                <div class="inline-stacked-item">
                    <span class="small">tasty</span>
                    <span class="large">coffee</span>
                </div>
            </div>
        </div>
    </div>

    <!-- THREE.JS LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* =========================================
           1. THREE.JS COFFEE BEANS
           ========================================= */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x2A1A0E, 0.03); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xFEF3E2, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const accentLight = new THREE.PointLight(0xD4621A, 1.5, 50);
        accentLight.position.set(10, -10, 5);
        scene.add(accentLight);

        const createBeanGeometry = () => {
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const pos = geometry.attributes.position;
            const vertex = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                vertex.fromBufferAttribute(pos, i);
                vertex.z *= 0.6;
                if (Math.abs(vertex.x) < 0.3) {
                    const factor = 1 - (Math.abs(vertex.x) / 0.3);
                    vertex.z -= 0.3 * factor;
                }
                pos.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            geometry.computeVertexNormals();
            return geometry;
        };

        const beanGeometry = createBeanGeometry();
        const beanMaterial = new THREE.MeshStandardMaterial({
            color: 0x2A1A0E,
            roughness: 0.6,
            metalness: 0.1,
        });

        const beans = [];
        for (let i = 0; i < 35; i++) {
            const bean = new THREE.Mesh(beanGeometry, beanMaterial);
            const scale = Math.random() * 0.8 + 0.3;
            bean.scale.set(scale, scale, scale);
            
            const x = (Math.random() - 0.5) * 35;
            const y = (Math.random() - 0.5) * 25;
            const z = (Math.random() - 0.5) * 15 - 5;
            bean.position.set(x, y, z);
            
            bean.userData = {
                rotX: (Math.random() - 0.5) * 0.015,
                rotY: (Math.random() - 0.5) * 0.015,
                rotZ: (Math.random() - 0.5) * 0.015,
                floatSpeed: Math.random() * 0.5 + 0.2,
                floatOffset: Math.random() * Math.PI * 2
            };
            scene.add(bean);
            beans.push(bean);
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            beans.forEach(bean => {
                bean.rotation.x += bean.userData.rotX;
                bean.rotation.y += bean.userData.rotY;
                bean.rotation.z += bean.userData.rotZ;
                bean.position.y += Math.sin(time * bean.userData.floatSpeed + bean.userData.floatOffset) * 0.005;
            });
            renderer.render(scene, camera);
        }
        animate();

        /* =========================================
           2. PARALLAX SCROLL EFFECT
           ========================================= */
        const waveBack = document.getElementById('wave-back');
        const waveFront = document.getElementById('wave-front');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            waveBack.style.transform = `translateY(${scrollY * 0.15}px)`;
            waveFront.style.transform = `translateY(${scrollY * 0.3}px)`;
        });

        /* =========================================
           3. RESIZE HANDLER
           ========================================= */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
