<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Days Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/waves.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/collage.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- THREE.JS CANVAS -->
    <div id="canvas-container"></div>

    <!-- PARALLAX & LOOPING WAVES -->
    <div class="wave-wrapper">
        <div class="wave-layer-back" id="wave-back">
            <div class="wave-track">
                <div class="wave-svg">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 140, 360 140 C 540 140, 540 260, 720 260 C 900 260, 900 140, 1080 140 C 1260 140, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#D4621A" />
                    </svg>
                </div>
                <div class="wave-svg">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 140, 360 140 C 540 140, 540 260, 720 260 C 900 260, 900 140, 1080 140 C 1260 140, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#D4621A" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="wave-layer-front" id="wave-front">
            <div class="wave-track">
                <div class="wave-svg">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 170, 360 170 C 540 170, 540 260, 720 260 C 900 260, 900 170, 1080 170 C 1260 170, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#F4AE52" opacity="0.95" />
                    </svg>
                </div>
                <div class="wave-svg">
                    <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 0 260 C 180 260, 180 170, 360 170 C 540 170, 540 260, 720 260 C 900 260, 900 170, 1080 170 C 1260 170, 1260 260, 1440 260 L 1440 400 L 0 400 Z" fill="#F4AE52" opacity="0.95" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="hero-container">
        
        <!-- Left: Text & Buttons -->
        <div class="text-content">
            <div class="heading-row">
                <span>Good</span>
                <span>days</span>
            </div>

            <div class="heading-row">
                <div class="text-btn-grid">
                    <span>start</span>
                    <span>with a</span>
                    
                    <div class="btn-group">
                        <button class="btn">Order Now</button>
                        <button class="btn btn-alt">Reserve Table</button>
                    </div>
                </div>

                <div class="inline-stacked">
                    <div class="inline-stacked-item">
                        <span class="small">nice</span>
                        <span class="large">coffee</span>
                    </div><br>
                    <div class="inline-stacked-item">
                        <span class="small">good</span>
                        <span class="large">coffee</span>
                    </div><br>
                    <div class="inline-stacked-item">
                        <span class="small">tasty</span>
                        <span class="large">coffee</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Professional Collage -->
        <div class="image-content">
            <div class="collage-wrapper">
                <div class="img-container img-1">
                    <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=800&auto=format&fit=crop" class="collage-img" alt="Coffee cup on wood">
                </div>
                <div class="img-container img-2">
                    <img src="https://images.unsplash.com/photo-1559525839-b184a4d698c7?q=80&w=800&auto=format&fit=crop" class="collage-img" alt="Coffee cup with beans">
                </div>
                <div class="img-container img-3">
                    <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=800&auto=format&fit=crop" class="collage-img" alt="Coffee cup close up">
                </div>
            </div>
        </div>

    </div>
    

    <!-- THREE.JS LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="js/parallax.js"></script>
    <script src="js/beans.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
