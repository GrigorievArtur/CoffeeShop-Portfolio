<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Days Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Inter:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #FEF3E2;
            --amber: #F4AE52;
            --burnt: #D4621A;
            --espresso: #2A1A0E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--espresso);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Wave */
        .wave-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50vh;
            z-index: 0;
            pointer-events: none;
        }
        .wave-container svg { width: 100%; height: 100%; display: block; }

        /* Layout */
        .content {
            position: relative;
            z-index: 1;
            padding: 10vw;
            font-family: 'Cormorant', serif;
            font-size: 6.45em;
        }

        .heading-row {
            display: flex;
            align-items: baseline;
            gap: 0.25em;
        }

        /* Inline Stacked Text */
        .inline-stacked {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 0.75;
            transform: translateY(-0.7em);
        }

        .inline-stacked-item {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 0.75;
            vertical-align: top;
        }

        .small {
            display: inline-block;
            color: var(--amber);
            transform: translate(-0.5em, 0.5em);
            font-size: 0.35em;
            margin-right: -0.5em;
            font-family: 'Cormorant', serif;
        }

        .large {
            color: var(--cream);
            font-family: 'Cormorant', serif;
        }
    </style>
</head>
<body>

    <div class="wave-container">
        <svg viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 0 400 L 400 400 C 600 400, 700 250, 900 200 C 1100 150, 1200 220, 1440 250 L 1440 400 Z" fill="#D58C48" />
            <path d="M 0 400 L 500 400 C 750 400, 850 220, 1050 180 C 1250 140, 1350 200, 1440 220 L 1440 400 Z" fill="#F4AE52" opacity="0.9" />
        </svg>
    </div>

    <div class="content">
        <div class="heading-row">
            <span>Good</span>
            <span>days</span>
        </div>

        <div class="heading-row">
            
            <!-- NEW GRID GROUP FOR TEXT + BUTTONS -->
            <div class="text-btn-grid">
                
                <style>
                    /* 2-Column Grid */
                    .text-btn-grid {
                        display: grid;
                        grid-template-columns: auto auto; 
                        column-gap: 0.25em; 
                        row-gap: 1rem; 
                        align-items: baseline;
                        justify-items: start;
                    }

                    /* Button Group spans both columns */
                    .btn-group {
                        grid-column: 1 / -1; /* Spans full width of the two words */
                        display: flex;
                        flex-direction: column;
                        align-items: center; /* Centers the 70% width buttons */
                        gap: 3.4rem; /* INCREASED: Matches the vertical gap between coffee words */
                        margin-top: 0.7rem; /* Matches the gap from the text above */
                        width: 100%;
                    }

                    /* Button Styling */
                    .btn {
                        width: 70%; /* 70% as long */
                        font-family: 'Inter', sans-serif;
                        font-size: 0.9rem;
                        font-weight: 700;
                        letter-spacing: 0.15em;
                        text-transform: uppercase;
                        background-color: var(--burnt);
                        color: var(--cream);
                        padding: 1rem 0;
                        border-radius: 999px;
                        border: none;
                        cursor: pointer;
                        transition: all 0.3s ease;
                        text-align: center;
                    }

                    .btn:hover {
                        background-color: var(--amber);
                        color: var(--espresso);
                        transform: translateY(-2px);
                    }
                </style>

                <!-- Text that forms the 2 columns -->
                <span>start</span>
                <span>with a</span>
                
                <!-- Buttons spanning the columns -->
                <div class="btn-group">
                    <button class="btn">Order</button>
                    <button class="btn">Book</button>
                </div>

            </div>

            <!-- Coffee Stack -->
            <div class="inline-stacked">
                <div class="inline-stacked-item">
                    <span class="small">nice</span>
                    <span class="large">coffee</span>
                </div><br>
                <div class="inline-stacked-item">
                    <span class="small">good</span>
                    <span class="large">coffee</span>
                </div><br>
                <div class="inline-stacked-item">
                    <span class="small">tasty</span>
                    <span class="large">coffee</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
