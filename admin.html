<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor — Good Days Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

    <header class="admin-bar">
        <div class="admin-id">
            <a class="admin-logo" href="index.html#home">Good Days Coffee</a>
            <span class="admin-tag">Floor console</span>
            <span class="admin-clock" id="admin-clock"></span>
        </div>

        <div class="admin-controls">
            <label class="admin-field">
                <span>Date</span>
                <input type="date" id="admin-date">
            </label>
            <button class="chip-btn" type="button" id="reset-demo">Reset demo</button>
            <a class="chip-btn" href="index.html#reserve">Guest view →</a>
        </div>
    </header>

    <main class="admin-main">

        <div class="alerts" id="alerts" aria-live="polite"></div>

        <div class="admin-grid">

            <section class="panel floor-panel">
                <div class="panel-head">
                    <h2>Floor</h2>
                    <span class="panel-meta" id="floor-meta">Live · today</span>
                </div>
                <div class="floor-cards" id="floor"></div>
            </section>

            <aside class="admin-side">

                <section class="panel">
                    <h2>Book for a guest</h2>
                    <form id="staff-form" class="staff-form" novalidate>
                        <label>Name
                            <input id="staff-name" type="text" placeholder="Guest name" required>
                        </label>
                        <label>Phone
                            <input id="staff-phone" type="tel" placeholder="+1 (555) 000-0000">
                        </label>
                        <div class="staff-row">
                            <label>Date
                                <input id="staff-date" type="date">
                            </label>
                            <label>Time
                                <select id="staff-time"></select>
                            </label>
                        </div>
                        <div class="staff-row is-tight">
                            <label>Table
                                <select id="staff-table"></select>
                            </label>
                            <label>Party
                                <select id="staff-party">
                                    <option value="1">1</option>
                                    <option value="2" selected>2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                            </label>
                        </div>
                        <label class="staff-check">
                            <input type="checkbox" id="staff-override">
                            Allow override (audited)
                        </label>
                        <button class="staff-submit" type="submit">Book</button>
                        <p class="staff-msg" id="staff-msg" hidden></p>
                    </form>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Schedule</h2>
                        <span class="panel-meta" id="schedule-meta"></span>
                    </div>
                    <ul class="schedule" id="schedule"></ul>
                </section>

                <section class="panel">
                    <h2>Activity</h2>
                    <ul class="audit" id="audit"></ul>
                </section>

            </aside>
        </div>
    </main>

    <script src="js/booking-core.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
